# Local OpenCompany Gateway config: mock models and fake upstreams instead of
# real vendors, so nothing is billed and no vendor keys are needed.
#
# The policy blocks mirror gateway/litellm/config.yaml. Differences, all
# deliberate: mock responses or fake_upstream.py behind every model, spend logs
# flush every second so the tests can read them, and there is no Slack alerting
# or proxy-range trust.

model_list:
  - model_name: openai/*
    litellm_params:
      model: openai/*
      api_key: sk-local-unused
      mock_response: pong
      # The audio routes ignore mock_response and call the upstream: the fake
      # one (fake_upstream.py), never api.openai.com.
      api_base: http://fake-upstream:8080/v1
  - model_name: claude-*
    litellm_params:
      model: anthropic/claude-*
      api_key: sk-local-unused
      mock_response: pong
  - model_name: gemini-*
    litellm_params:
      model: gemini/gemini-*
      api_key: local-unused
      mock_response: pong
  # OpenAI-format names for the providers OpenCompany calls on native routes
  # (the RLM agent's library speaks only OpenAI's format).
  - model_name: anthropic/*
    litellm_params:
      model: anthropic/*
      api_key: sk-local-unused
      mock_response: pong
  - model_name: gemini/*
    litellm_params:
      model: gemini/*
      api_key: local-unused
      mock_response: pong
  # Real upstreams (fake_upstream.py) for what mocks can't show: spend rows on
  # /v1/messages, the native Gemini route and the audio routes, and streamed
  # pricing. Exact names win over the wildcards above.
  #
  # A dotted alias that is not a price-list key, the shape LiteLLM's own test
  # for PR #44341 uses: a stream through it must still be priced at the
  # deployment's model.
  - model_name: claude-opus-4.8-20261010
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: sk-local-unused
      api_base: http://fake-upstream:8080
  - model_name: gemini-2.5-flash-live
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: local-unused
      api_base: http://fake-upstream:8080
  # The price override of gateway/litellm/config.yaml, same values.
  - model_name: openai/gpt-4o-mini-tts
    litellm_params:
      model: openai/gpt-4o-mini-tts
      api_key: sk-local-unused
      api_base: http://fake-upstream:8080/v1
      input_cost_per_token: 0.000075
      output_cost_per_token: 0
  # OpenCompany's default embedding model under its wire name: the OpenAI SDK
  # asks for base64 vectors, which the mock's "pong" can't decode to.
  - model_name: openai/text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: sk-local-unused
      api_base: http://fake-upstream:8080/v1
  - model_name: groq/whisper-large-v3
    litellm_params:
      model: groq/whisper-large-v3
      api_key: local-unused
      api_base: http://fake-upstream:8080/v1

router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT

litellm_settings:
  json_logs: true
  timezone: UTC
  max_internal_user_budget: 50
  internal_user_budget_duration: 1mo
  budget_exceeded_status_code: 402
  block_requests_for_models_without_pricing: true
  upperbound_key_generate_params:
    rpm_limit: 120
    tpm_limit: 2000000
    max_parallel_requests: 32
  cache: true
  cache_params:
    type: redis
    mode: default_off
    ttl: 172800

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  proxy_batch_write_at: 1
  disable_error_logs: true
  maximum_spend_logs_retention_period: 90d
  maximum_spend_logs_retention_interval: 1d
  fail_closed_budget_enforcement: true
