# Release workflow: predeploy gate, publish the registry tarball to npmjs and
# GitHub Packages with bun. No npm CLI: bun packs, authenticates (~/.npmrc
# written from the job's token) and publishes. The jobs have no setup-node step
# of their own; the composite setup action installs Node, which bun uses to run
# vite during `bun run build`.
#
# Triggers on version tag push. Manual dispatch publishes an EXISTING tag
# again, to one or both registries (a lapsed token, a failed mirror): the
# publish jobs check out that tag so the tarball is the tag's tree, while the
# predeploy gate runs against the dispatching branch as it always has.

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish again (e.g. v0.2.0)
        required: true
        type: string
      registries:
        description: Registries to publish to
        type: choice
        options: [both, npmjs, github-packages]
        default: both

permissions:
  contents: read

jobs:
  predeploy:
    uses: ./.github/workflows/predeploy.yml

  publish-npm:
    name: Publish to npm
    needs: predeploy
    if: github.event_name == 'push' || inputs.registries != 'github-packages'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: python -m cli version sync
      - name: Configure npmjs credentials
        run: printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify npmjs credentials
        run: bun pm whoami
      - name: Publish public package
        run: bun publish --access public

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: predeploy
    if: github.event_name == 'push' || inputs.registries != 'npmjs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: python -m cli version sync
      # bun 1.4 ignores package.json publishConfig.registry, and it keeps an
      # .npmrc token only for the registry that same file points at (the
      # default or a scoped one), so the scope is routed to GitHub Packages
      # here, next to the token. The v0.2.0 mirror publish went to npmjs
      # with this GitHub token and failed with "missing authentication"
      # before that was known. GitHub Packages uses the repository-scoped
      # GITHUB_TOKEN.
      - name: Configure GitHub Packages credentials
        run: printf '@zeenie-ai:registry=https://npm.pkg.github.com/\n//npm.pkg.github.com/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun publish
