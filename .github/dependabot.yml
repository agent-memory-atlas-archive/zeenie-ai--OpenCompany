# Dependabot is DISABLED by policy (2026-09-12): no version-update PRs and no
# security-update PRs. Dependencies move by hand, alongside test runs:
#   JS   -> bump the range in the relevant package.json (or the top-level
#           `overrides` block for transitive pins), `bun install`, run tests
#   pip  -> `uv lock --upgrade-package <name>` in server/, regenerate
#           server/requirements.txt with the `uv export` command in its
#           header, `uv sync`, tests
# Alerts stay visible in the repository's Security tab.
#
# Why this file still exists: without an entry for a directory, Dependabot
# routes that directory's alerts to whatever updater it guesses, and for a
# bun.lock tree it guesses npm_and_yarn, which cannot read bun.lock and fails
# every run ("can't update vulnerable dependencies for projects without a
# lockfile or pinned version requirement", desktop/vitest, 2026-09-11). The
# entries below keep every surface mapped to the right ecosystem while the
# `ignore: "*"` rule stops every PR, security updates included.
#
# Turning Dependabot's security-update attempts off entirely is a repository
# setting (Settings > Code security > Dependabot), not something this file
# can do; see docs-internal/ci_cd.md "Dependency update policy".
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: bun
    directory: /desktop
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  # server/ needs both entries. Because of server/uv.lock, Dependabot runs its
  # uv updater there, and while only the pip entry ignored updates it kept
  # opening security PRs (#140 to #142, 2026-09-30 and 10-01).
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
